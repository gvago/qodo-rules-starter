<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NVIDIA Session 2 Timer</title><style>:root{--bg:#0d0e10;--fg:#f7f7f8;--muted:#a9adb7;--accent:#9b8cff;--line:#30333a}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;display:grid;min-height:100vh;place-items:center}.wrap{text-align:center;width:min(90vw,850px)}.label{color:var(--accent);font-weight:800;letter-spacing:.12em}.clock{font-size:clamp(90px,24vw,240px);font-variant-numeric:tabular-nums;font-weight:750;line-height:1;margin:30px 0}.bar{height:16px;background:var(--line);border-radius:8px;overflow:hidden}.fill{height:100%;background:var(--accent);width:100%}.buttons{display:flex;justify-content:center;gap:12px;margin-top:28px}button{font:700 20px system-ui;padding:13px 24px;border-radius:12px;border:1px solid var(--line);background:#202329;color:var(--fg)}button.primary{background:var(--accent);color:#0d0e10}.hint{margin-top:20px;color:var(--muted)}body.done .clock{color:var(--accent)}</style></head><body><main class="wrap"><div class="label">SESSION 2 · TIME REMAINING</div><div class="clock" id="clock">15:00</div><div class="bar"><div class="fill" id="fill"></div></div><div class="buttons"><button class="primary" id="start">Start</button><button id="reset">Reset</button></div><p class="hint">Choose the duration in the URL: <code>?m=3</code>, <code>?m=15</code>, or <code>?m=17</code>. It never starts until Start is clicked.</p></main><script>const q=new URLSearchParams(location.search);const minutes=Math.max(1,Number(q.get('m'))||15);let total=minutes*60,left=total,timer=null;const clock=document.getElementById('clock'),fill=document.getElementById('fill'),start=document.getElementById('start');function paint(){clock.textContent=String(Math.floor(left/60)).padStart(2,'0')+':'+String(left%60).padStart(2,'0');fill.style.width=(left/total*100)+'%';document.body.classList.toggle('done',left===0)}function stop(){clearInterval(timer);timer=null;start.textContent=left===total?'Start':'Resume'}start.onclick=()=>{if(timer)return;start.textContent='Pause';timer=setInterval(()=>{left=Math.max(0,left-1);paint();if(!left)stop()},1000)};start.addEventListener('dblclick',stop);document.getElementById('reset').onclick=()=>{stop();left=total;paint()};document.addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault();timer?stop():start.click()}if(e.key==='r'){left=total;stop();paint()}});paint();</script></body></html>
